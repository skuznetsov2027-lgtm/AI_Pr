
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода в місті</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #93c5fd);
            color: #1e293b;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input, button {
            width: 100%;
            padding: 13px;
            border-radius: 9px;
            font-size: 16px;
        }

        input {
            border: 1px solid #cbd5e1;
        }

        button {
            border: none;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #result {
            margin-top: 22px;
        }

        .weather-card {
            padding: 20px;
            text-align: center;
            border-radius: 14px;
            background: #eff6ff;
        }

        .temperature {
            font-size: 42px;
            font-weight: bold;
            margin: 15px 0;
        }

        .wind {
            font-size: 17px;
        }

        #message {
            margin-top: 16px;
            text-align: center;
            color: #b91c1c;
            overflow-wrap: anywhere;
        }

        .hint {
            margin-top: 20px;
            font-size: 13px;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>🌤️ Погода в місті</h1>

        <p class="subtitle">
            Дізнайтеся поточну температуру та швидкість вітру
        </p>

        <form id="weatherForm">
            <input
                type="text"
                id="city"
                placeholder="Наприклад, Київ"
                aria-label="Назва міста"
                maxlength="100"
                required
            >

            <button type="submit" id="searchButton">
                Дізнатися погоду
            </button>
        </form>

        <div id="message" role="status" aria-live="polite"></div>
        <section id="result" aria-live="polite"></section>

        <p class="hint">
            Дані отримуються із сервісу Open-Meteo
        </p>
    </main>

    <script>
        const form = document.getElementById("weatherForm");
        const cityInput = document.getElementById("city");
        const button = document.getElementById("searchButton");
        const message = document.getElementById("message");
        const result = document.getElementById("result");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const city = cityInput.value.trim();

            message.textContent = "";
            result.replaceChildren();

            if (!city) {
                message.textContent = "Введіть назву міста.";
                cityInput.focus();
                return;
            }

            button.disabled = true;
            button.textContent = "Завантаження...";

            try {
                const response = await fetch(
                    "/api/weather?city=" + encodeURIComponent(city)
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.detail || "Не вдалося отримати погоду."
                    );
                }

                const card = document.createElement("div");
                card.className = "weather-card";

                const cityTitle = document.createElement("h2");
                cityTitle.textContent = data.city;

                const temperature = document.createElement("p");
                temperature.className = "temperature";
                temperature.textContent =
                    data.temperature + " " + data.temperature_unit;

                const wind = document.createElement("p");
                wind.className = "wind";
                wind.textContent =
                    "💨 Швидкість вітру: " +
                    data.wind_speed + " " + data.wind_speed_unit;

                card.append(cityTitle, temperature, wind);
                result.appendChild(card);

            } catch (error) {
                message.textContent =
                    error.message || "Помилка з'єднання із сервером.";
            } finally {
                button.disabled = false;
                button.textContent = "Дізнатися погоду";
            }
        });
    </script>
</body>
</html>
